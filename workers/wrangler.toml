name            = "llp-chart"
main            = "src/index.js"
compatibility_date = "2024-01-01"

# KV namespace — create with: wrangler kv namespace create CHART
# Then paste the resulting id below.
[[kv_namespaces]]
binding  = "CHART"
id       = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# PUSH_TOKEN is set as a secret, not here:
#   wrangler secret put PUSH_TOKEN
