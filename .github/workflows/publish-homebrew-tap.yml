name: Publish Homebrew Tap

# Fires on any v* tag push, or manually for retroactive publishes.
# Delegates all formula update logic to Laotree/homebrew-tap via
# repository_dispatch — no direct writes to the tap repo needed here.
#
# Required secret: HOMEBREW_TAP_TOKEN
#   A fine-grained PAT scoped to Laotree/homebrew-tap with
#   "Contents: write" permission (needed to send repository_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0)'
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check secret is set
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set. Add a fine-grained PAT with 'Contents: write' on Laotree/homebrew-tap."
            exit 1
          fi

      # Wait for release-binaries.yml to attach the prebuilt tarballs and their
      # .sha256 sidecar files, then collect the checksums so the tap can render
      # a binary-download formula (no from-source build for end users).
      - name: Collect release checksums
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          targets="aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu"
          for target in $targets; do
            asset="llp-${target}.tar.gz.sha256"
            sha=""
            for attempt in $(seq 1 30); do
              if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                   --pattern "$asset" --output - 2>/dev/null > sha.txt; then
                sha="$(cut -d' ' -f1 sha.txt)"
                break
              fi
              echo "waiting for $asset (attempt $attempt)..."
              sleep 20
            done
            if [ -z "$sha" ]; then
              echo "::error::checksum $asset not found on release $TAG after waiting"
              exit 1
            fi
            echo "${target}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Trigger homebrew-tap update
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          curl --fail -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Laotree/homebrew-tap/dispatches \
            -d '{
              "event_type": "update-formula",
              "client_payload": {
                "formula": "llp",
                "version": "${{ steps.tag.outputs.tag }}",
                "sha256": {
                  "aarch64-apple-darwin": "${{ steps.sums.outputs.aarch64-apple-darwin }}",
                  "x86_64-apple-darwin": "${{ steps.sums.outputs.x86_64-apple-darwin }}",
                  "x86_64-unknown-linux-gnu": "${{ steps.sums.outputs.x86_64-unknown-linux-gnu }}"
                }
              }
            }'
