name: Publish Homebrew Tap

# Triggers on any v* tag push, or manually via workflow_dispatch
# (use dispatch to retroactively publish an already-pushed tag, e.g. v0.3.0)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows pushing back to this repo's master

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0   # fetch all tags so rev-parse can resolve them

      - name: Resolve tag and commit SHA
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Dereference annotated tag → underlying commit SHA
          SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # ── 1. Update the formula copy kept in this repo ──────────────────────
      - name: Patch homebrew/Formula/llp.rb
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="${{ steps.tag.outputs.sha }}"
          sed -i "s|tag: \"v[0-9.]*\"|tag: \"${TAG}\"|"         homebrew/Formula/llp.rb
          sed -i "s|revision: \"[0-9a-f]*\"|revision: \"${SHA}\"|" homebrew/Formula/llp.rb

      - name: Commit local formula update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebrew/Formula/llp.rb
          # no-op if formula was already up to date
          git diff --staged --quiet || \
            git commit -m "chore: sync Homebrew formula to ${{ steps.tag.outputs.tag }} [skip ci]"
          git push

      # ── 2. Update Laotree/homebrew-tap ────────────────────────────────────
      - name: Push updated formula to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/Laotree/homebrew-tap.git" \
            /tmp/homebrew-tap

          cd /tmp/homebrew-tap
          sed -i "s|tag: \"v[0-9.]*\"|tag: \"${TAG}\"|"            Formula/llp.rb
          sed -i "s|revision: \"[0-9a-f]*\"|revision: \"${SHA}\"|" Formula/llp.rb

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/llp.rb
          # no-op if tap was already at this version
          git diff --staged --quiet || git commit -m "chore: update llp to ${TAG}"
          git push
