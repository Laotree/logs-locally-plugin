app = "llp-chart"
primary_region = "nrt"   # Tokyo — closest to Shanghai

[build]
  dockerfile = "Dockerfile"

[env]
  LLP_DATA_DIR = "/data"

# Persistent volume for activity.json (survives restarts / deploys)
[mounts]
  source      = "llp_data"
  destination = "/data"

[[services]]
  internal_port = 8484
  protocol      = "tcp"

  [[services.ports]]
    force_https = true
    handlers    = ["http"]
    port        = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "connections"
    soft_limit = 20
    hard_limit = 25
