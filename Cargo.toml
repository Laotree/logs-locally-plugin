[package]
name = "logs-locally-plugin"
version = "0.8.5"
edition = "2021"
description = "Read Claude Code session JSONL files and persist them to a local SQLite database for querying and analysis"
homepage = "https://github.com/Laotree/logs-locally-plugin"
repository = "https://github.com/Laotree/logs-locally-plugin"
license = "MIT"
readme = "README.md"

[[bin]]
name = "llp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
regex = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
