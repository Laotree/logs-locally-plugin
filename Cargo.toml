[package]
name = "logs-locally-plugin"
version = "0.10.1"
edition = "2021"
description = "Read Claude Code session JSONL files and persist them to a local SQLite database for querying and analysis"
homepage = "https://github.com/Laotree/logs-locally-plugin"
repository = "https://github.com/Laotree/logs-locally-plugin"
license = "MIT"
readme = "README.md"

[[bin]]
name = "llp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
opt-level = "z"   # optimize for binary size
lto = true        # link-time optimization across crates
codegen-units = 1 # better optimization at the cost of parallel codegen
strip = true      # strip symbols/debug info from the binary
panic = "abort"   # drop unwinding machinery
