<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs Locally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #EDF1F7;
    --bg-sunk:   #E2E7F0;
    --surf:      #FAFBFE;
    --surf-2:    #F2F5FA;
    --line:      #D7DEEA;
    --line-2:    #B9C4D6;
    --ink-0:     #0B1220;
    --ink-1:     #2A3344;
    --ink-2:     #5D6B81;
    --ink-3:     #93A0B4;
    --accent:    #0891B2;
    --accent-d:  #0E7490;
    --accent-2:  #7C3AED;
    --accent-2d: #6D28D9;
    --grade-s:   #0891B2;
    --grade-a:   #16A34A;
    --grade-b:   #D97706;
    --grade-c:   #EA580C;
    --grade-d:   #DC2626;
    --grade-na:  #94A3B8;
    --grid-0:    #DCE3EE;
    --grid-line: rgba(11,18,32,0.05);
    --glow-1:    rgba(8,145,178,0.10);
    --glow-2:    rgba(124,58,237,0.08);
    --grid-shadow: 0 1px 2px rgba(11,18,32,0.04), 0 1px 3px rgba(11,18,32,0.05);
  }
  body[data-theme="dark"] {
    --bg:        #06080F;
    --bg-sunk:   #04060B;
    --surf:      #0D1322;
    --surf-2:    #0A0E19;
    --line:      #1B2336;
    --line-2:    #2C3850;
    --ink-0:     #E9EEF8;
    --ink-1:     #B9C3D8;
    --ink-2:     #7D8AA4;
    --ink-3:     #4E5B75;
    --accent:    #00E5FF;
    --accent-d:  #00B0CC;
    --accent-2:  #A78BFA;
    --accent-2d: #8B6CF8;
    --grade-s:   #00E5FF;
    --grade-a:   #4ADE80;
    --grade-b:   #FACC15;
    --grade-c:   #FB923C;
    --grade-d:   #F87171;
    --grade-na:  #5B6B85;
    --grid-0:    #131A2B;
    --grid-line: rgba(0,229,255,0.045);
    --glow-1:    rgba(0,229,255,0.07);
    --glow-2:    rgba(167,139,250,0.09);
    --grid-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  body[data-accent="forest"]  { --accent: #059669; --accent-d: #047857; --accent-2: #475569; --accent-2d: #334155; --grade-s: #059669; }
  body[data-accent="plum"]    { --accent: #7C3AED; --accent-d: #6D28D9; --accent-2: #0891B2; --accent-2d: #0E7490; --grade-s: #7C3AED; }
  body[data-accent="crimson"] { --accent: #E11D48; --accent-d: #BE123C; --accent-2: #475569; --accent-2d: #334155; --grade-s: #E11D48; }
  body[data-accent="mono"]    { --accent: #18181B; --accent-d: #000000; --accent-2: #71717A; --accent-2d: #52525B; --grade-s: #18181B; }
  body[data-accent="forest"][data-theme="dark"]  { --accent: #34D399; --accent-d: #10B981; --accent-2: #A78BFA; --accent-2d: #8B6CF8; --grade-s: #34D399; --grid-line: rgba(52,211,153,0.045); --glow-1: rgba(52,211,153,0.07); }
  body[data-accent="plum"][data-theme="dark"]    { --accent: #A78BFA; --accent-d: #8B5CF6; --accent-2: #00E5FF; --accent-2d: #00B0CC; --grade-s: #A78BFA; --grid-line: rgba(167,139,250,0.05); --glow-1: rgba(167,139,250,0.08); }
  body[data-accent="crimson"][data-theme="dark"] { --accent: #FB7185; --accent-d: #F43F5E; --accent-2: #A78BFA; --accent-2d: #8B6CF8; --grade-s: #FB7185; --grid-line: rgba(251,113,133,0.05); --glow-1: rgba(251,113,133,0.07); }
  body[data-accent="mono"][data-theme="dark"]    { --accent: #E4E4E7; --accent-d: #A1A1AA; --accent-2: #818CF8; --accent-2d: #6366F1; --grade-s: #E4E4E7; --grid-line: rgba(228,228,231,0.04); --glow-1: rgba(228,228,231,0.05); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink-1);
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Layered tech backdrop: blueprint grid + ambient glow fields */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 38px 38px;
    -webkit-mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 0%, transparent 80%);
    mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 0%, transparent 80%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(640px 420px at 88% -8%, var(--glow-2), transparent 70%),
      radial-gradient(760px 540px at -8% 104%, var(--glow-1), transparent 70%),
      radial-gradient(520px 320px at 40% 0%, var(--glow-1), transparent 75%);
  }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  .mono { font-family: "JetBrains Mono", monospace; }
  .serif { font-family: "Oxanium", "JetBrains Mono", monospace; }

  .app { display: flex; height: 100vh; position: relative; z-index: 1; }

  @keyframes llp-spin { to { transform: rotate(360deg); } }
  @keyframes llp-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ── Sidebar ─────────────────────────────────────────────── */
  .llp-side {
    width: 210px; flex-shrink: 0; padding: 12px 10px;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--surf-2) 72%, transparent);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    display: flex; flex-direction: column;
    height: 100vh; position: sticky; top: 0;
  }
  .llp-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
  .llp-brand-mark {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 6px;
    display: grid; place-items: center; color: var(--bg);
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 11px;
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .llp-brand-name { font-family: "Oxanium", monospace; font-weight: 700; font-size: 13.5px; color: var(--ink-0); letter-spacing: 0.06em; text-transform: uppercase; }
  .llp-brand-tag { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-3); letter-spacing: 0.1em; margin-top: -1px; }
  .llp-nav { display: flex; flex-direction: column; gap: 1px; flex: 1; }
  .llp-nav-section {
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.12em; padding: 10px 8px 4px; text-transform: uppercase;
  }
  .llp-nav button {
    background: transparent; border: none; text-align: left;
    padding: 6px 8px; border-radius: 6px; color: var(--ink-1);
    font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 9px; transition: background .12s, color .12s, box-shadow .12s;
  }
  .llp-nav button:hover { background: var(--bg-sunk); color: var(--ink-0); }
  .llp-nav button.active {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--ink-0);
    box-shadow: inset 2px 0 0 var(--accent), 0 0 16px color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .llp-nav button.sub { padding-left: 26px; color: var(--ink-2); font-size: 12.5px; font-weight: 400; }
  .llp-nav button.sub.active { color: var(--accent); background: transparent; box-shadow: none; }
  .llp-nav-glyph { width: 16px; text-align: center; color: var(--ink-3); font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .llp-nav button.active .llp-nav-glyph { color: var(--accent); text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
  .llp-nav-count {
    margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-3); padding: 1px 6px; background: var(--bg); border-radius: 4px;
  }
  .llp-side-foot {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-3); padding: 8px 8px;
    border-top: 1px solid var(--line); line-height: 1.7; letter-spacing: 0.04em;
  }
  .llp-side-foot .pulse {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: llp-pulse 2.2s ease-out infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes llp-pulse {
    0% { box-shadow: 0 0 6px var(--accent), 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70% { box-shadow: 0 0 6px var(--accent), 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 6px var(--accent), 0 0 0 0 transparent; }
  }

  /* ── TopBar ──────────────────────────────────────────────── */
  .app-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #mainContent { flex: 1; min-height: 0; overflow-y: auto; }
  .llp-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    position: sticky; top: 0; z-index: 4;
  }
  .llp-top-bc { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; margin-bottom: 2px; }
  .llp-top-bc span + span::before { content: " / "; color: var(--line-2); margin: 0 6px; }
  .llp-top-title { font-family: "Oxanium", monospace; font-weight: 600; font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-0); }
  .llp-top-right { display: flex; align-items: center; gap: 10px; }
  .llp-search {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: color-mix(in srgb, var(--surf) 80%, transparent);
    border: 1px solid var(--line);
    border-radius: 7px; color: var(--ink-2); font-family: inherit; font-size: 13px; min-width: 280px;
    transition: border-color .15s, box-shadow .15s;
  }
  .llp-search:focus-within {
    border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .llp-search input { background: transparent; border: none; outline: none; flex: 1; color: var(--ink-1); font-family: inherit; font-size: 13.5px; }
  .llp-search kbd { font-family: "JetBrains Mono", monospace; font-size: 11px; padding: 2px 5px; background: var(--bg-sunk); color: var(--ink-3); border-radius: 3px; border: 1px solid var(--line); }
  .top-actions { display: flex; gap: 8px; }
  .top-btn {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: var(--surf); border: 1px solid var(--line); border-radius: 7px;
    color: var(--ink-1); font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    transition: border-color .15s, color .15s, box-shadow .15s;
  }
  .top-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 22%, transparent); }
  .top-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent); }
  .top-btn.primary:hover { background: var(--accent-d); border-color: var(--accent-d); color: var(--bg); }

  /* ── Panel ───────────────────────────────────────────────── */
  .llp-panel {
    background: color-mix(in srgb, var(--surf) 86%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 16px;
    position: relative; overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .llp-panel::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 45%, transparent), transparent);
    opacity: .6; pointer-events: none;
  }
  .llp-panel:hover {
    border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 7%, transparent), var(--grid-shadow);
  }
  .llp-ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .llp-ph-title { font-family: "Oxanium", monospace; font-weight: 600; font-size: 13px; color: var(--ink-0); letter-spacing: 0.07em; text-transform: uppercase; }
  .llp-ph-sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .llp-ph-right { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-3); letter-spacing: 0.05em; }
  .llp-ph-right b { color: var(--ink-0); }

  /* ── KPI ─────────────────────────────────────────────────── */
  .llp-kpi {
    padding: 12px 14px; background: color-mix(in srgb, var(--surf) 86%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px;
    position: relative; overflow: hidden;
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .llp-kpi::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent-2) 70%, transparent) 60%, transparent);
    opacity: .75;
  }
  .llp-kpi:hover {
    border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
    box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 10%, transparent);
    transform: translateY(-1px);
  }
  .llp-kpi-label { font-size: 11px; color: var(--ink-2); letter-spacing: 0.09em; text-transform: uppercase; font-weight: 700; font-family: "JetBrains Mono", monospace; }
  .llp-kpi-value { font-family: "Oxanium", monospace; font-size: 28px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.1; margin: 4px 0 3px; color: var(--ink-0); }
  .llp-kpi-value sup { font-family: "Manrope", sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 2px; vertical-align: super; }
  .llp-kpi-sub { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-2); }
  .llp-kpi-delta { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; margin-left: 6px; }

  /* ── GradeBadge ──────────────────────────────────────────── */
  .llp-grade { display: inline-grid; place-items: center; font-weight: 700; border-radius: 5px; font-family: "JetBrains Mono", monospace; }

  /* ── SourceBadge ─────────────────────────────────────────── */
  .llp-src { font-size: 11px; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.06em; text-transform: lowercase; font-weight: 600; font-family: "JetBrains Mono", monospace; }
  .llp-src.claude { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .llp-src.pi { background: color-mix(in srgb, var(--accent-2) 14%, transparent); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 30%, transparent); }
  .llp-src.codex { background: color-mix(in srgb, #22c55e 14%, transparent); color: #4ADE80; border: 1px solid color-mix(in srgb, #22c55e 30%, transparent); }
  .llp-src.opencode { background: color-mix(in srgb, #6366f1 14%, transparent); color: #818CF8; border: 1px solid color-mix(in srgb, #6366f1 30%, transparent); }
  body:not([data-theme="dark"]) .llp-src.claude { color: var(--accent-d); }
  body:not([data-theme="dark"]) .llp-src.pi { color: var(--accent-2d); }
  body:not([data-theme="dark"]) .llp-src.codex { color: #15803d; }
  body:not([data-theme="dark"]) .llp-src.opencode { color: #4338ca; }

  /* ── Contribution Heatmap ────────────────────────────────── */
  .llp-hm-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .llp-hm-title-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .llp-hm-title { font-family: "Oxanium", monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-0); display: flex; align-items: center; gap: 8px; }
  .llp-hm-total { font-family: "Oxanium", monospace; font-size: 21px; font-weight: 700; color: var(--ink-0); letter-spacing: 0.01em; }
  .llp-hm-sub { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-2); }
  .llp-hm-row { display: flex; gap: 8px; align-items: flex-start; }
  .llp-hm-yax { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; padding-top: 18px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-3); }
  .llp-hm-yax span { line-height: 11px; height: 11px; }
  .llp-hm-grid-wrap { position: relative; flex: 1; overflow: hidden; }
  .llp-hm-months { display: grid; grid-auto-flow: column; height: 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3); position: relative; margin-bottom: 4px; }
  .llp-hm-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; }
  .llp-hm-cell { width: 11px; height: 11px; border-radius: 2.5px; transition: transform .1s; }
  .llp-hm-cell:hover { transform: scale(1.35); outline: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
  .llp-hm-legend { display: flex; align-items: center; gap: 6px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3); margin-top: 8px; justify-content: flex-end; }
  .llp-hm-legend .swatch { width: 11px; height: 11px; border-radius: 2.5px; }
  .llp-hm-tooltip { position: fixed; background: color-mix(in srgb, var(--ink-0) 92%, transparent); color: var(--bg); font-family: "JetBrains Mono", monospace; font-size: 11px; padding: 7px 10px; border-radius: 6px; pointer-events: none; z-index: 10; white-space: nowrap; line-height: 1.5; display: none; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); box-shadow: 0 4px 18px rgba(0,0,0,.3); }
  .llp-hm-tooltip b { font-weight: 600; }

  /* ── Score breakdown ────────────────────────────────────── */
  .llp-score-breakdown { display: flex; flex-direction: column; gap: 10px; }
  .llp-score-row { display: grid; grid-template-columns: 116px 1fr 56px; gap: 10px; align-items: center; }
  .llp-score-label { font-size: 13.5px; color: var(--ink-1); font-weight: 500; }
  .llp-score-desc { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .llp-score-track { height: 5px; background: var(--bg-sunk); border-radius: 3px; position: relative; overflow: hidden; }
  .llp-score-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width 1.1s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 8px 0 color-mix(in srgb, var(--accent) 20%, transparent); }
  .llp-score-value { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--ink-0); font-weight: 600; text-align: right; }
  .llp-score-value small { color: var(--ink-3); font-weight: 400; }

  /* ── GradeHistogram ─────────────────────────────────────── */
  .llp-hist { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 4px; }
  .llp-hist-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; gap: 6px; }
  .llp-hist-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .llp-hist-bar { width: 100%; border-radius: 4px 4px 0 0; transition: height 1s cubic-bezier(.2,.7,.2,1); position: relative; background-image: linear-gradient(180deg, rgba(255,255,255,.18), transparent 60%); }
  .llp-hist-bar-n { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-1); font-weight: 600; }
  .llp-hist-glabel { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: 0.02em; }

  /* ── Sparkline ───────────────────────────────────────────── */
  .llp-sparkline { display: block; }

  /* ── BarList ─────────────────────────────────────────────── */
  .llp-barlist { display: flex; flex-direction: column; gap: 10px; }
  .llp-bl-row { display: grid; grid-template-columns: 1fr 56px; gap: 4px 12px; align-items: center; }

  const num = typeof n === 'string' ? parseFloat(n) : n;
  if (num >= 1_000_000) return (num / 1_000_000).toFixed(num >= 10_000_000 ? 1 : 2) + 'M';

    <div class="llp-kpi-sub">${sub||''}${delta!==undefined&&delta!==0?`<span class="llp-kpi-delta" style="color:${delta>0?'#5C8A6F':'#B85450'}">${delta>0?'▲':'▼'} ${Math.abs(delta)}</span>`:''}</div>
  </div>`;
}

/* ── Panel ──────────────────────────────────────────────────── */
function Panel(title, sub, right, children, flush) {
  return `<div class="llp-panel">${(title||right)?`<div class="llp-ph"><div>${title?`<div class="llp-ph-title">${title}</div>`:''}${sub?`<div class="llp-ph-sub">${sub}</div>`:''}</div>${right?`<div class="llp-ph-right">${right}</div>`:''}</div>`:''}<div>${children}</div></div>`;
}

/* ── Score Breakdown ────────────────────────────────────────── */
const SCORE_DIMS = [
    { key:'security', label:'Security', max:15, desc:'Dangerous command detection' },
  { key:'effectivity', label:'Effectivity', max:15, desc:'Completion vs failure signals' },
  { key:'solidity', label:'Solidity', max:10, desc:'Test coverage' },
  { key:'efficiency', label:'Efficiency', max:15, desc:'Correction loops / token bloat' },
  { key:'planning', label:'Planning', max:15, desc:'Structured planning / sequential thinking' },
  { key:'recovery', label:'Recovery', max:15, desc:'Error handling / self-correction' },
  { key:'accuracy', label:'Accuracy', max:15, desc:'User satisfaction vs corrections' },
];

function ScoreBreakdown(dims) {
  if (!dims) return `<div style="padding:24px 0;text-align:center;color:var(--ink-3)"><div class="mono" style="font-size:11px;letter-spacing:0.1em">TRIVIAL · NOT SCORED</div><div style="font-size:12px;margin-top:6px">Single command / empty interaction — not scored</div></div>`;
  return `<div class="llp-score-breakdown">${SCORE_DIMS.map(d => {
    const v = dims[d.key] || 0;
    const pct = (v / d.max) * 100;
    const c = pct >= 90 ? 'var(--grade-s)' : pct >= 75 ? 'var(--grade-a)' : pct >= 60 ? 'var(--grade-b)' : 'var(--grade-c)';
    return `<div class="llp-score-row">
      <div><div class="llp-score-label">${d.label}</div><div class="llp-score-desc">${d.desc}</div></div>
      <div class="llp-score-track"><div class="llp-score-fill" style="width:${pct}%;background:${c}"></div></div>
      <div class="llp-score-value mono">${v}<small>/${d.max}</small></div>
    </div>`;
  }).join('')}</div>`;
}

/* ── Contribution Heatmap ───────────────────────────────────── */
function ContributionGrid(cells, max, color, label, total) {
  const weeks = Math.ceil(cells.length / 7);
  const weekCols = []; for (let w = 0; w < weeks; w++) weekCols.push(cells.slice(w*7, w*7+7));
  const months = [];
  weekCols.forEach((wk, wi) => {
    const f = wk[0]; if (!f) return;
    if (f.date.getDate() <= 7 && (wi===0||!months.length||months[months.length-1].label!==fmtMonth(f.date)))
      months.push({ wi, label: fmtMonth(f.date) });
  });
  const colorFor = (v) => {
    if (!v) return 'var(--grid-0)';
    const k = Math.min(1, v / max);
    const step = k < 0.18 ? 0.22 : k < 0.4 ? 0.42 : k < 0.65 ? 0.65 : k < 0.85 ? 0.85 : 1.0;
    return `color-mix(in oklch, ${color} ${Math.round(step*100)}%, var(--grid-0))`;
  };
  return `<div style="position:relative">
    <div class="llp-hm-title-row"><div class="llp-hm-title"><span class="llp-hm-dot" style="background:${color}"></span>${label}</div><div class="llp-hm-total">${total}</div><div class="llp-hm-sub">Past 12 months</div></div>
    <div class="llp-hm-row">
      <div class="llp-hm-yax"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
      <div class="llp-hm-grid-wrap">
        <div class="llp-hm-months" style="grid-template-columns:repeat(${weeks},11px);column-gap:3px">${months.map(m=>`<span style="grid-column:${m.wi+1}/span 4">${m.label}</span>`).join('')}</div>
        <div class="llp-hm-grid">${cells.map(c=>{
          const v = label === 'Sessions' ? c.sessions : c.tokens;
          return `<div class="llp-hm-cell" style="background:${colorFor(v)};grid-row:${c.dow+1}" data-tip="${c.date.getFullYear()}-${String(c.date.getMonth()+1).padStart(2,'0')}-${String(c.date.getDate()).padStart(2,'0')} · ${label==='Sessions'?`${v} session${v!==1?'s':''}`:`${fmtNum(v)} tokens`}"></div>`;
        }).join('')}</div>
      </div>
    </div>
    <div class="llp-hm-legend">Less ${[0,0.22,0.45,0.7,1].map(k=>`<div class="swatch" style="background:${k===0?'var(--grid-0)':`color-mix(in oklch,${color} ${Math.round(k*100)}%,var(--grid-0))`}"></div>`).join('')} More</div>
    <div class="llp-hm-tooltip" id="hmTip"></div>
  </div>`;
}

function DualHeatmap(cells, totals) {
  const sMax = Math.max(1, ...cells.map(c=>c.sessions));
  const tMax = Math.max(1, ...cells.map(c=>c.tokens));
  const ac = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#00E5FF';
  const ac2 = getComputedStyle(document.body).getPropertyValue('--accent-2').trim() || '#A78BFA';
  return `<div style="display:flex;flex-direction:column;gap:20px">
    ${ContributionGrid(cells, sMax, ac, 'Sessions', totals.sessions.toLocaleString())}
    ${ContributionGrid(cells, tMax, ac2, 'Tokens', fmtNum(totals.tokens))}
  </div>`;
}

/* ── Grade Histogram ────────────────────────────────────────── */
function GradeHistogram(data) {
  const max = Math.max(...data.map(d=>d.n));
  const gc = GRADE_COLORS();
  return `<div class="llp-hist">${data.map(d=>{
    const color = gc[d.g] || gc.N;
    const pct = (d.n / max) * 100;
    return `<div class="llp-hist-col"><div class="llp-hist-bar-wrap"><div class="llp-hist-bar" style="height:${pct}%;background:${color}"><div class="llp-hist-bar-n">${d.n}</div></div></div><div class="llp-hist-glabel" style="color:${color}">${d.g}</div></div>`;
  }).join('')}</div>`;
}

/* ── Sparkline ──────────────────────────────────────────────── */
function Sparkline(data, color, w, h) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = Math.max(1, max - min);
  const pts = data.map((v,i)=>{ const x=(i/(data.length-1))*w; const y=h-((v-min)/range)*(h-6)-3; return [x,y]; });
  const id = 'sp_'+Math.random().toString(36).slice(2,7);
  const path = 'M '+pts.map(p=>p.join(',')).join(' L ');
  const area = path+` L ${w},${h} L 0,${h} Z`;
  return `<svg class="llp-sparkline" width="${w}" height="${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>${(()=>{const p=pts[pts.length-1]; return `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${color}"/>`;})()}</svg>`;
}

/* ── Bar List ───────────────────────────────────────────────── */
function BarList(items) {
  const max = Math.max(...items.map(i=>i.sessions));
  const ac = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#00E5FF';
  const acd = getComputedStyle(document.body).getPropertyValue('--accent-d').trim() || '#00B0CC';
  const ac2 = getComputedStyle(document.body).getPropertyValue('--accent-2').trim() || '#A78BFA';
  const colors = [ac, acd, ac2, '#6C6E76'];
  return `<div class="llp-barlist">${items.map((it,i)=>{
    const pct = (it.sessions/max)*100;
    return `<div class="llp-bl-row">
      <div><div class="llp-bl-name">${it.name}</div><div class="llp-bl-meta">${it.sessions} sessions · ${fmtNum(it.tokens)} tok · avg <span style="color:var(--ink-1)">${it.avg}</span></div></div>
      <div class="llp-bl-val">${it.sessions}</div>
      <div class="llp-bl-track"><div class="llp-bl-fill" style="width:${pct}%;background:${colors[i%colors.length]}"></div></div>
    </div>`;
  }).join('')}</div>`;
}

/* ── Data Loading ──────────────────────────────────────── */
let loadingEl = () => `<div style="display:flex;align-items:center;justify-content:center;padding:80px 0;color:var(--ink-2);font-size:14px"><span class="mono" style="display:flex;align-items:center;gap:10px"><span style="display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:llp-spin .8s linear infinite"></span>Loading...</div>`;
let errEl = (msg) => `<div style="display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--ink-2);font-size:13px;flex-direction:column;gap:8px"><span style="font-family:JetBrains Mono,monospace;font-size:36px;color:var(--ink-3)">⚠</span><span>${msg||'Failed to load data'}</span><button onclick="renderMain()" style="margin-top:6px;padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px">Retry</button></div>`;

async function loadDashboard() {
  const main = document.getElementById('mainContent');
  if (!main) return;
  main.innerHTML = loadingEl();
  try {
    const [stats, scoreStats, activity] = await Promise.all([
      api('/api/stats'),
      api('/api/score-stats'),
      api('/api/activity'),
    ]);
    cache('stats', stats);
    cache('scoreStats', scoreStats);
    cache('activity', activity);
    cache('sessions', null);

    // Build heatmap cells from activity days
    const cells = activityDaysToCells(activity.days || []);
    const hmTotals = heatmapTotals(cells);

    // Grade distribution
    const gd = (scoreStats.grade_distribution || []).map(g => ({ g: g.grade, n: g.count }));
    const allGrades = ['S','A','B','C','D','N/A'];
    const gdFull = allGrades.map(gl => gd.find(x=>x.g===gl) || { g: gl, n: 0 });

    // Aggregates
    const agg = scoreStats.aggregates || {};
    const scoredTotal = agg.scored_count || 0;
    const unscoredTotal = scoreStats.unscored_count || 0;

    // Recent sessions (top 6 from stats)
    let recentSessions = [];
    if (cached('sessionsList')) {
      recentSessions = cached('sessionsList').slice(0, 6);
    } else {
      try {
        const sessRes = await api('/api/sessions?limit=6');
        recentSessions = (sessRes.sessions || []);
        cache('sessionsList', sessRes.sessions || []);
      } catch(_) {}
    }

    // Models for bar list
    const models = (stats.models || []).map(m => ({
      name: m.model,
      sessions: m.session_count,
      tokens: m.token_count,
      avg: Math.round((m.token_count / Math.max(m.session_count, 1)) / 100),
    }));

    main.innerHTML = renderDashboardHtml(stats, agg, gdFull, scoredTotal, unscoredTotal, cells, hmTotals, models, recentSessions);
    initHeatmapTooltips();
  } catch(e) {
    main.innerHTML = errEl('Failed to load dashboard: '+e.message);
  }
}

  const main = document.getElementById('mainContent');

    if (svFilters.grade && svFilters.grade !== 'all') params.set('grade', svFilters.grade);
    if (svFilters.q) params.set('q', svFilters.q);
    const res = await api('/api/sessions?' + params.toString());

    cache('sessionsList', raw);

async function loadStatsView() {

/* ── Activity data helpers ─────────────────────────────── */
function activityDaysToCells(days) {
  const today = new Date();
  const start = new Date(today);
  start.setDate(today.getDate()-365);
  start.setDate(start.getDate()-start.getDay());
  const cells = [];
  let cur = new Date(start);
  const dayMap = {};
  (days || []).forEach(d => { dayMap[d.day] = d; });
  while (cur <= today) {
    const key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
    const rec = dayMap[key];
    cells.push({
      date: new Date(cur),
      dow: cur.getDay(),
      sessions: rec ? rec.session_count : 0,
      tokens: rec ? rec.token_count : 0,
    });
    cur.setDate(cur.getDate()+1);
  }
  return cells;
}

function heatmapTotals(cells) {
  const sessions = cells.reduce((s,c)=>s+c.sessions,0);
  const tokens = cells.reduce((s,c)=>s+c.tokens,0);
  const active = cells.filter(c=>c.sessions>0).length;
  let curStreak=0; for(let i=cells.length-1;i>=0;i--){if(cells[i].sessions>0)curStreak++;else break;}
  let longest=0, curL=0; cells.forEach(c=>{if(c.sessions>0){curL++;longest=Math.max(longest,curL);}else curL=0;});
  // Find peak day
  let peak = { day:'', sessions:0, tokens:0 };
  cells.forEach(c => { if (c.sessions > peak.sessions) { peak = { day: c.date, sessions: c.sessions, tokens: c.tokens }; } });
  return { sessions, tokens, active, longest, curStreak, peak };
}

/* ── Score Dimensions: map backend field names to JS keys ─ */
function scoreToDims(sc) {
  if (!sc) return null;
  return {
    security: sc.security,
    effectivity: sc.effectivity,
    solidity: sc.solidity,
    efficiency: sc.efficiency,
    planning: sc.planning_quality,
    recovery: sc.recovery_ability,
    accuracy: sc.hallucination_rate,
  };
}

function renderMain() {
  const stats = cached('stats');
  const totalSessions = (stats && stats.total_sessions) || 0;

  switch(view) {
    case 'dashboard':
      title = 'Dashboard';

function setView(v) {

      ${KPI('Active Days', hmTotals.active, 'of 365 · ' + Math.round(hmTotals.active/365*100) + '% active', null)}
    </div>
    ${Panel('Activity · Dual Heatmap', 'GitHub-style · sessions + tokens · data stays local, never shared', '',
      DualHeatmap(cells, { sessions: hmTotals.sessions, tokens: hmTotals.tokens }) +
      `<div class="heatmap-foot">
        <div><div class="lbl">Current Streak</div><div><b>${hmTotals.curStreak} days</b></div></div>
        <div><div class="lbl">Longest Streak</div><div><b>${hmTotals.longest} days</b></div></div>
        <div><div class="lbl">Active Days</div><div><b>${hmTotals.active} / 365</b></div></div>
        <div><div class="lbl">Peak Day</div><div><b>${peakDate}</b> · ${peak ? peak.sessions + ' sessions · ' + fmtNum(peak.tokens) + ' tok' : ''}</div></div>
      </div>`
    )}
    <div class="dash-grid-2">
      ${Panel('Grade Distribution', (scoredTotal||0) + ' scored sessions' + (unscoredTotal ? ' · ' + unscoredTotal + ' unscored' : ''), '',
        GradeHistogram(gd) +
        `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
          <div><div class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.08em;margin-bottom:4px">Scored</div><div><b style="font-size:18px;color:var(--ink-0);font-family:JetBrains Mono,monospace">${scoredTotal}</b></div></div>
          <div><div class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.08em;margin-bottom:4px">Avg Score</div><div><b style="font-size:18px;color:var(--ink-0);font-family:JetBrains Mono,monospace">${agg && agg.avg_total ? Math.round(agg.avg_total) : '—'}</b></div></div>
          <div><div class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.08em;margin-bottom:4px">Best Grade</div><div>${gd.length > 0 && gd[0].n > 0 ? GradeBadge(gd[0].g, 'sm') + ' <span style="margin-left:6px;font-size:14px;color:var(--ink-1)">' + gd[0].n + '</span>' : '<span style="color:var(--ink-3);font-size:14px">—</span>'}</div></div>
        </div>`
      )}
      ${Panel('Model Usage', 'By session count', '',
        models.length > 0 ? BarList(models) : '<div style="padding:24px 0;text-align:center;color:var(--ink-3);font-size:13px">No models data yet</div>'
      )}
    </div>
    <div class="dash-grid-3">
      ${Panel('Weekly Trend', 'Last 7 days', '',
        last7.length > 0
          ? `<div class="trend-row">
              <div class="trend-cell"><div class="lbl">Sessions</div>${Sparkline(last7, 'var(--accent)', 220, 56)}<div class="val">${last7[last7.length-1]}</div><div class="mono" style="font-size:11px;color:var(--ink-3);margin-top:2px">${last7[last7.length-1]-last7[0] >= 0 ? '↑' : '↓'} ${Math.abs(last7[last7.length-1]-last7[0])} vs 1 week ago</div></div>
              <div class="trend-cell"><div class="lbl">Tokens (k)</div>${Sparkline(last7Tok, 'var(--accent-2)', 220, 56)}<div class="val">${last7Tok[last7Tok.length-1]}<span style="font-size:14px;color:var(--ink-2);margin-left:4px">k</span></div><div class="mono" style="font-size:11px;color:var(--ink-3);margin-top:2px">${last7Tok[last7Tok.length-1]-last7Tok[0] >= 0 ? '↑' : '↓'} ${Math.abs(last7Tok[last7Tok.length-1]-last7Tok[0])}k vs 1 week ago</div></div>
            </div>`
          : '<div style="padding:24px 0;text-align:center;color:var(--ink-3);font-size:13px">Not enough data</div>'
      )}
      ${Panel('Recent Sessions', 'Click for details', '<span style="cursor:pointer;color:var(--accent)" onclick="setView(\'sessions\')">View all →</span>',
        recentSessions.length > 0
          ? `<div class="recent-list">${recentSessions.map(s=>`
            <div class="recent-row" onclick="openSession('${s.id}')">
              ${GradeBadge((s.score&&s.score.grade)||'N/A','sm')}
              <div><div class="recent-title">${escHtml(s.title||s.id.slice(0,24))}</div><div class="recent-meta">${SourceBadge(s.source||'claude')}<span>${(s.created_at||'').slice(5,16)}</span><span>· ${s.message_count||0} msg</span></div></div>
              <div class="recent-tok"><div>${fmtNum(s.token_count||0)}</div><small>tokens</small></div>
              <div style="color:var(--ink-3);font-size:14px">›</div>
            </div>`).join('')}</div>`
          : '<div style="padding:24px 0;text-align:center;color:var(--ink-3);font-size:13px">No sessions yet</div>'
      )}
    </div>
  </div>`;
}

let svFilters = { q:'', src:'all', model:'all', grade:'all' };
let svAllModels = null;

function renderSessionsHtml(sessions, scoresMap) {
  const filtered = sessions;
  const filterGroups = [
    { key:'src', label:'Source', value:svFilters.src, opts:[['all','All'],['claude','Claude Code'],['pi','Pi Agent'],['codex','Codex CLI'],['opencode','opencode']] },
    { key:'model', label:'Model', value:svFilters.model, opts:[['all','All'],...(svAllModels||[]).map(m=>[m,m])] },
    { key:'grade', label:'Grade', value:svFilters.grade, opts:[['all','All'],['S','S'],['A','A'],['B','B'],['C','C'],['D','D'],['F','F']] },
  ];
  return `<div class="sv">
    <div class="sv-filters">${filterGroups.map(f=>`<div class="sv-filter-group"><span class="sv-filter-label">${f.label}</span><div class="sv-filter-pills">${f.opts.map(([v,lbl]) => `<button class="sv-pill${f.value===v?' active':''}" onclick="svFilters.${f.key}='${v}';loadSessions()">${lbl}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="sv-summary"><span>Showing <b style="color:var(--ink-1)">${filtered.length}</b> sessions</span></div>
    <div class="sv-table">
      <div class="sv-head">
        <div></div>
        <div>Session</div>
        <div>Project</div>
        <div>Created</div>
        <div style="text-align:right">Tokens</div>
        <div style="text-align:right">Score</div>
        <div style="text-align:right">Grade</div>
      </div>
      ${filtered.map(s=>{
        const sc = scoresMap[s.id];
        const grade = sc ? sc.grade : 'N/A';
        const scoreVal = sc ? sc.total_score : null;
        return `<div class="sv-row" onclick="openSession('${s.id}')">
          ${SourceBadge(s.source||'claude')}
          <div><div class="sv-title">${escHtml(s.title||s.id.slice(0,24))}</div><div class="sv-meta"><span class="mono" style="color:var(--ink-2)">${s.model||'—'}</span><span>·</span><span>${s.message_count||0} msg</span></div></div>
          <div class="sv-mono dim" style="font-size:11.5px">${s.cwd ? s.cwd.replace(/^~\//,'').split('/').slice(-2).join('/') : '—'}</div>
          <div class="sv-mono">${(s.created_at||'').slice(5,16)}</div>
          <div class="sv-mono" style="text-align:right">${fmtNum(s.token_count||0)}</div>
          <div class="sv-mono" style="text-align:right;color:var(--ink-0);font-weight:600">${scoreVal !== null ? scoreVal : '—'}</div>
          <div style="text-align:right">${GradeBadge(grade,'sm')}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

let openThinking = {};
let openTool = {};

function renderDetailHtml(s, msgs) {
  const sc = s.score;
  const dims = sc ? scoreToDims(sc) : null;
  const grade = sc ? sc.grade : 'N/A';
  const scoreVal = sc ? sc.total_score : null;
  const fmt = (t) => t.replace(/\*\*([^*]+)\*\*/g,'<b style="color:var(--ink-0)">$1</b>').replace(/\`([^\`]+)\`/g,'<code>$1</code>');
  return `<div class="sd">
    <button class="sd-back" onclick="setView('sessions')">← BACK TO SESSIONS</button>
    <div class="sd-head">
      <div class="sd-title-row">
        <div style="flex:1;min-width:0">
          <h1 class="sd-title">${escHtml(s.title||s.id.slice(0,40))}</h1>
          <div class="sd-meta-row">
            ${[{lbl:'Source',v:SourceBadge(s.source||'claude')},{lbl:'Model',v:s.model||'—'},{lbl:'Created',v:s.created_at||'—'},{lbl:'Messages',v:s.message_count||0},{lbl:'Tokens',v:(s.token_count||0).toLocaleString()}].map(c=>`<div class="sd-meta-cell"><div class="lbl">${c.lbl}</div><div class="val">${c.v}</div></div>`).join('')}
          </div>
        </div>
        <div class="sd-grade-block">
          <div class="sd-grade-letter">${grade}</div>
          <div class="sd-grade-meta">
            <div class="sd-grade-score">${scoreVal !== null ? scoreVal : '—'}<small>/100</small></div>
            <div class="sd-grade-tag">${scoreVal !== null ? (scoreVal>=90?'ELITE':scoreVal>=80?'EXCELLENT':'STANDARD') : 'NOT SCORED'}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="sd-grid">
      <div>
        ${Panel('Conversation Thread', msgs.length+' messages', '',
          msgs.length > 0
            ? `<div class="sd-thread">${msgs.map((m,i)=>{
              const avCls = m.role==='user'?'user':m.role==='assistant'?'assistant':'tool';
              const avLbl = m.role==='user'?'U':m.role==='assistant'?'A':'T';
              if(m.role==='tool') {
                return `<div class="msg"><div class="msg-avatar tool">${avLbl}</div><div class="msg-bubble tool">
                  <div class="tool-header ${openTool[i]?'open':''}" onclick="toggleTool(${i})">
                    <span style="color:var(--ink-3);font-family:JetBrains Mono,monospace;font-size:12px">${openTool[i]?'▾':'▸'}</span>
                    <span class="tool-name">Tool call</span>
                    <span class="msg-time">${(m.created_at||'').slice(11,19)}</span>
                  </div>
                  ${openTool[i]?`<div class="tool-result">${escHtml(m.content).slice(0,2000)}</div>`:''}
                </div></div>`;
              }
              return `<div class="msg"><div class="msg-avatar ${avCls}">${avLbl}</div><div class="msg-bubble ${m.role}">
                <div class="msg-head"><div class="msg-role">${m.role==='user'?'You':'Assistant'}</div><div class="msg-time">${(m.created_at||'').slice(11,19)}</div><div class="msg-tok">${m.token_count||0} tok</div></div>
                <div class="msg-body">${fmt(escHtml(m.content))}</div>
              </div></div>`;
            }).join('')}</div>`
            : '<div style="padding:40px 0;text-align:center;color:var(--ink-3);font-size:13px">No messages loaded</div>'
        )}
      </div>
      <div class="sd-side">
        ${Panel('Score Breakdown', '7 dimensions · total 100', '',
          ScoreBreakdown(dims)
        )}
      </div>
    </div>
  </div>`;
}

function toggleThinking(i) { openThinking[i]=!openThinking[i]; renderMain(); }
function toggleTool(i) { openTool[i]=!openTool[i]; renderMain(); }

function renderStatsHtml(models, dims, scoreStats) {
  return `<div class="stats-sv"><div class="grid-2">
    ${Panel('Models · Token Distribution', models.length + ' models used', '',
      models.length > 0 ? BarList(models) : '<div style="padding:24px 0;text-align:center;color:var(--ink-3);font-size:13px">No model data yet</div>'
    )}
    ${Panel('Score · 7-Dim Averages', dims ? 'Average across all scored sessions' : 'No scored sessions yet', '',
      dims ? ScoreBreakdown(dims) : '<div style="padding:24px 0;text-align:center;color:var(--ink-3);font-size:13px">Score data will appear once sessions are scored</div>'
    )}
  </div></div>`;
}

function renderSettingsHtml() {
  const items = [
    { lbl:'Listening', v:':8484' },
    { lbl:'DB Path', v:'~/.local/share/llp/logs.db' },
    { lbl:'Claude Projects', v:'~/.claude/projects' },
    { lbl:'Pi Sessions', v:'~/.pi/agent/sessions' },

    )}

/* ── Tweaks Panel ────────────────────────────────────────── */
let tweaksOpen = false;
let dragOffset = { x:16, y:16 };

function toggleTweaks() { tweaksOpen=!tweaksOpen; renderMain(); }

function renderTweaksPanel() {
  if (!tweaksOpen) return `<button onclick="toggleTweaks()" style="position:fixed;right:16px;bottom:16px;z-index:2147483646;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb, var(--surf) 80%, transparent);border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));color:var(--ink-0);font-size:16px;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 0 14px color-mix(in srgb, var(--accent) 18%, transparent)">⚙</button>`;
  const t = tweaksState;
  return `<div class="twk-panel" style="right:${dragOffset.x}px;bottom:${dragOffset.y}px" id="twkPanel">
    <div class="twk-hd" onmousedown="startTweakDrag(event)"><b>Tweaks</b><button class="twk-x" onclick="toggleTweaks()">✕</button></div>
    <div class="twk-body">
      <div class="twk-sect">Theme</div>
      <div class="twk-row twk-row-h">
        <div class="twk-lbl"><span>Dark Mode</span></div>
        <button type="button" class="twk-toggle" data-on="${t.dark?'1':'0'}" role="switch" onclick="toggleDark()"><i></i></button>
      </div>
      <div class="twk-sect">Accent</div>
      <div class="twk-row twk-row-h">
        <div class="twk-lbl"><span>accent</span></div>
        <div class="twk-seg" style="flex:1">${ACCENT_OPTIONS.map((o,i)=>`<button${o===t.accent?' style="color:var(--accent);font-weight:700"':''} onclick="setAccent('${o}')">${o}</button>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

function toggleDark() { tweaksState.dark=!tweaksState.dark; applyTheme(tweaksState); renderMain(); }
function setAccent(v) { tweaksState.accent=v; applyTheme(tweaksState); renderMain(); }

function startTweakDrag(e) {
  const panel = document.getElementById('twkPanel');
  if (!panel) return;
  const r = panel.getBoundingClientRect();
  const sx = e.clientX, sy = e.clientY;
  const startR = window.innerWidth - r.right;
  const startB = window.innerHeight - r.bottom;
  const move = (ev) => { dragOffset.x = startR - (ev.clientX - sx); dragOffset.y = startB - (ev.clientY - sy); if(panel){panel.style.right=dragOffset.x+'px';panel.style.bottom=dragOffset.y+'px';} };
  const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
}

/* ── Heatmap tooltip ────────────────────────────────────── */
function initHeatmapTooltips() {
  const tip = document.getElementById('hmTip');
  if (!tip) return;
  document.querySelectorAll('.llp-hm-cell[data-tip]').forEach(c => {
    c.addEventListener('mouseenter',()=>{tip.textContent=c.dataset.tip;tip.style.display='block';});
    c.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-32)+'px';});
    c.addEventListener('mouseleave',()=>{tip.style.display='none';});
  });
}

/* ── Init ────────────────────────────────────────────────── */
applyTheme(tweaksState);
renderMain();
</script>
